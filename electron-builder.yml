appId: com.stlgallery.app
productName: STL Gallery

directories:
  output: release

files:
  - out/**
  - package.json

fileAssociations:
  - ext: stl
    name: STL Model
    role: Viewer

mac:
  target: dmg
  category: public.app-category.graphics-design
  icon: build/icon.png

win:
  target:
    - portable # single-file, no-install portable .exe
    - msi # Windows installer (.msi)
    - nsis # NSIS setup installer (.exe)
  icon: build/icon.png
