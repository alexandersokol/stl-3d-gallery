name: Release

# Builds the app on every push to main and publishes a GitHub Release with the
# packaged installers attached. The version / tag is 1.0.<run_number>, where
# run_number is GitHub's monotonically increasing per-workflow counter, so each
# release gets a unique, increasing version automatically.

on:
  push:
    branches: [main]

# The release job creates a tag and a Release, which needs write access.
permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

defaults:
  run:
    # Use bash on every runner (including Windows) so the shell steps below are
    # identical across the OS matrix.
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Stamp version (1.0.<run_number>)
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Unit tests
        run: npm test

      - name: Build renderer + main
        run: npm run build

      - name: Package (macOS — universal .dmg)
        if: runner.os == 'macOS'
        # Unsigned build: disable auto code-sign discovery so packaging never
        # fails looking for a signing identity that isn't there.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --universal --publish never

      - name: Package (Windows — portable .exe, .msi, NSIS .exe)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.msi
            release/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the changelog can diff against the previous tag.
          fetch-depth: 0

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build changelog (commits since the last release tag)
        id: changelog
        run: |
          prev="$(git tag --list '1.0.*' --sort=-v:refname | head -n1)"
          echo "Previous release tag: ${prev:-<none>}"
          {
            echo "changelog<<CHANGELOG_EOF"
            if [ -z "$prev" ]; then
              echo "Initial release."
              echo ""
              git log --pretty=format:'- %s (%h)' HEAD
            else
              git log --pretty=format:'- %s (%h)' "$prev"..HEAD
            fi
            echo ""
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: STL 3D Gallery ${{ env.VERSION }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
